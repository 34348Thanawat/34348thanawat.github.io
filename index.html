<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | Thanawat</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff4e8, #ffffff);
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* เมนู */
nav {
    background: #ffffff;
    padding: 18px 10px;
    text-align: center;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
}

nav a {
    color: #e87511;
    text-decoration: none;
    font-weight: bold;
    margin: 0 9px;
    display: inline-block;
}

nav a:hover {
    color: #b95000;
}

/* หน้าหลัก */
.hero {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
}

.hero-box {
    width: 100%;
    max-width: 900px;
    background: white;
    padding: 55px 30px;
    text-align: center;
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(230,120,20,0.18);
}

.profile-home {
    width: 190px;
    height: 190px;
    object-fit: cover;
    border-radius: 50%;
    border: 6px solid #f58220;
    margin-bottom: 25px;
}

.decoration {
    font-size: 45px;
    margin-bottom: 15px;
}

h1 {
    font-size: 55px;
    color: #e87511;
    margin-bottom: 10px;
}

h2 {
    color: #555;
    margin-bottom: 20px;
}

.hero p {
    margin: 8px;
    color: #666;
    font-size: 18px;
}

/* ปุ่ม */
.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 13px 30px;
    background: #f58220;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
}

.btn:hover {
    background: #d96508;
}

/* Footer */
footer {
    background: #333;
    color: white;
    text-align: center;
    padding: 25px;
}

/* มือถือ */
@media(max-width:600px) {

    h1 {
        font-size: 38px;
    }

    nav a {
        font-size: 13px;
        margin: 5px;
    }

    .hero-box {
        padding: 40px 20px;
    }

    .profile-home {
        width: 150px;
        height: 150px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="index.html">หน้าหลัก</a>
    <a href="intro.html">คำนำ</a>
    <a href="profile.html">ประวัติส่วนตัว</a>
    <a href="university.html">มหาวิทยาลัย</a>
    <a href="projects.html">ผลงาน</a>
    <a href="certificates.html">เกียรติบัตร</a>
    <a href="activities.html">กิจกรรม</a>
</nav>

<section class="hero">

    <div class="hero-box">

        <div class="decoration">⚗️ 🧪 ✦</div>

        <!-- รูปตัวเอง -->
        <img src="profile.jpg"
             alt="รูปของธนวัฒน์"
             class="profile-home">

        <h1>PORTFOLIO</h1>

        <h2>แฟ้มสะสมผลงาน</h2>

        <p>นายธนวัฒน์ ห้าวหาญ</p>

        <p>นักเรียนชั้นมัธยมศึกษาปีที่ 6</p>

        <p>ความสนใจ : วิศวกรรมเคมี</p>

        <p>
            แฟ้มสะสมผลงานเพื่อประกอบการศึกษาต่อ
            ระดับมหาวิทยาลัย
        </p>

        <a href="intro.html" class="btn">
            เริ่มดู Portfolio →
        </a>

    </div>

</section>

<footer>
    <p>🧡 Portfolio ของฉัน 🧡</p>
    <p>Thank you for visiting</p>
</footer>

</body>
</html>
