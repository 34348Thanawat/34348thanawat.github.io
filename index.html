<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | Thanawat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#dff4ff,#f8fcff);
    color:#29465a;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* NAV */

nav{
    background:white;
    padding:16px 20px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,0.08);
}

nav a{
    text-decoration:none;
    color:#287db7;
    font-weight:bold;
    margin:0 12px;
}

nav a:hover{
    color:#185b8c;
}

/* HERO */

.hero{
    flex:1;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:60px 20px;

    background:
    radial-gradient(circle at 10% 20%,white,transparent 25%),
    radial-gradient(circle at 90% 80%,#ccecff,transparent 30%);
}

.hero-box{
    max-width:850px;
    width:100%;

    background:rgba(255,255,255,0.9);

    padding:55px 30px;

    border-radius:30px;

    box-shadow:0 10px 35px rgba(40,120,180,0.15);
}

.decoration{
    font-size:55px;
    margin-bottom:15px;
}

h1{
    font-size:55px;
    color:#2477b7;
    margin-bottom:10px;
}

h2{
    font-size:28px;
    color:#3c6077;
    margin-bottom:20px;
}

.hero p{
    font-size:18px;
    color:#62798a;
    margin:8px;
}

/* BUTTON */

.btn{
    display:inline-block;

    margin-top:25px;

    padding:13px 30px;

    background:#318bd0;

    color:white;

    text-decoration:none;

    border-radius:25px;

    font-weight:bold;

    transition:0.3s;
}

.btn:hover{
    background:#216da9;
    transform:translateY(-3px);
}

/* FOOTER */

footer{
    background:#28526d;
    color:white;

    text-align:center;

    padding:25px;
}

@media(max-width:600px){

    h1{
        font-size:38px;
    }

    h2{
        font-size:22px;
    }

    .hero-box{
        padding:40px 20px;
    }

    nav a{
        font-size:13px;
        margin:0 5px;
    }

}

</style>

</head>


<body>


<!-- เมนู -->

<nav>

    <a href="index.html">
        หน้าหลัก
    </a>

    <a href="intro.html">
        คำนำ
    </a>

    <a href="profile.html">
        ประวัติส่วนตัว
    </a>

</nav>


<!-- หน้าหลัก -->

<section class="hero">

    <div class="hero-box">

        <div class="decoration">
            ⚗️ 🧪 ✦
        </div>

        <h1>
            PORTFOLIO
        </h1>

        <h2>
            แฟ้มสะสมผลงาน
        </h2>

        <p>
            นายธนวัฒน์ ห้าวหาญ
        </p>

        <p>
            นักเรียนชั้นมัธยมศึกษาปีที่ 6
        </p>

        <p>
            ความสนใจ : วิศวกรรมเคมี
        </p>

        <p>
            แฟ้มสะสมผลงานเพื่อประกอบการศึกษาต่อระดับมหาวิทยาลัย
        </p>


        <a href="intro.html" class="btn">
            เริ่มดู Portfolio →
        </a>

    </div>

</section>


<!-- FOOTER -->

<footer>

    <p>
        ⚗️ Portfolio ของฉัน ⚗️
    </p>

    <p>
        Thank you for visiting
    </p>

</footer>


</body>

</html>
